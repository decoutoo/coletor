<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArborSense — Coletor de Campo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🌲</text></svg>" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 4px; }
</style>

<body>
<script>
(function() {
  var box = document.createElement('div');
  box.id = '__debug_box';
  box.style.cssText = 'position:fixed;top:0;left:0;right:0;max-height:50vh;overflow:auto;background:#111;color:#0f0;font:11px monospace;padding:8px;z-index:999999;white-space:pre-wrap;border-bottom:3px solid red;';
  box.textContent = 'DEBUG: aguardando eventos...\n';
  document.addEventListener('DOMContentLoaded', function() {
    document.body.insertBefore(box, document.body.firstChild);
  });
  function log(msg) {
    box.textContent += msg + '\n';
    if (!document.body.contains(box) && document.body) document.body.insertBefore(box, document.body.firstChild);
  }
  window.addEventListener('error', function(e) {
    if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
      log('FALHA AO CARREGAR: ' + (e.target.src || e.target.href));
    } else {
      log('ERRO JS: ' + e.message + ' (linha ' + e.lineno + ')');
    }
  }, true);
  window.addEventListener('unhandledrejection', function(e) {
    log('PROMISE REJEITADA: ' + e.reason);
  });
  log('React carregado? ' + (typeof window.React !== 'undefined'));
  setTimeout(function() {
    log('--- apos 1s ---');
    log('React: ' + (typeof window.React));
    log('ReactDOM: ' + (typeof window.ReactDOM));
    log('Babel: ' + (typeof window.Babel));
    log('XLSX: ' + (typeof window.XLSX));
    log('root tem conteudo? ' + (document.getElementById('root') ? document.getElementById('root').innerHTML.length : 'sem elemento root'));
  }, 1500);
})();
</script>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

// ─────────────────────────────────────────────────────────────────────────
// Persistence — browser localStorage
// ─────────────────────────────────────────────────────────────────────────
const STORAGE_KEY = "arborsense-coletor-v1";
function loadData() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; } catch (e) { return false; }
}

const seedSpecies = [
  { id: 1, popularName: "Ipê-amarelo", scientificName: "Tabebuia chrysotricha" },
  { id: 2, popularName: "Jatobá", scientificName: "Hymenaea courbaril" },
  { id: 3, popularName: "Pau-brasil", scientificName: "Paubrasilia echinata" },
];
const seedObservations = [
  { id: 1, code: "BIF", description: "Árvore bifurcada" },
  { id: 2, code: "OCO", description: "Presença de oco no tronco" },
  { id: 3, code: "DECL", description: "Árvore declinada / inclinada" },
];

function uid() { return Math.floor(Math.random() * 1e9); }

// ─────────────────────────────────────────────────────────────────────────
// Icons (self-contained, no external icon library)
// ─────────────────────────────────────────────────────────────────────────
const Icon = ({ children, size = 18, className = "" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
);
const IconLeaf = (p) => <Icon {...p}><path d="M4 19c8 1 16-4 16-15C10 4 3 10 4 19Z" /><path d="M4 19c3-4 6-7 12-11" /></Icon>;
const IconMapPin = (p) => <Icon {...p}><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12Z" /><circle cx="12" cy="9" r="2.3" /></Icon>;
const IconTreePine = (p) => <Icon {...p}><path d="M12 2 5 12h3l-4 6h4l-2 3h12l-2-3h4l-4-6h3L12 2Z" /><path d="M12 21v-3" /></Icon>;
const IconPlus = (p) => <Icon {...p}><path d="M12 5v14M5 12h14" /></Icon>;
const IconTrash = (p) => <Icon {...p}><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-8 0 1 13a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-13" /></Icon>;
const IconDownload = (p) => <Icon {...p}><path d="M12 3v12m0 0-4-4m4 4 4-4" /><path d="M4 19h16" /></Icon>;
const IconSprout = (p) => <Icon {...p}><path d="M12 20V10" /><path d="M12 10C12 5 6 4 4 4c0 3.5 2 6 8 6Z" /><path d="M12 10c0-4 5-5 8-5 0 3.3-2 6-8 6Z" /></Icon>;
const IconEdit = (p) => <Icon {...p}><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z" /></Icon>;
const IconX = (p) => <Icon {...p}><path d="M6 6l12 12M18 6 6 18" /></Icon>;
const IconCheck = (p) => <Icon {...p}><path d="M4 12l5 5L20 6" /></Icon>;

// ─────────────────────────────────────────────────────────────────────────
// Small UI primitives (mirrors the ArborSense visual language)
// ─────────────────────────────────────────────────────────────────────────
function Card({ className = "", children }) { return <div className={`bg-white rounded-xl border border-stone-200 ${className}`}>{children}</div>; }
function Badge({ children, tone = "default", className = "", onClick }) {
  const tones = {
    default: "bg-emerald-50 text-emerald-700 border-emerald-200",
    outline: "bg-white text-stone-600 border-stone-300",
    muted: "bg-stone-100 text-stone-600 border-stone-200",
  };
  return <span onClick={onClick} className={`inline-flex items-center text-xs font-medium px-2 py-0.5 rounded-full border ${tones[tone]} ${onClick ? "cursor-pointer hover:opacity-80" : ""} ${className}`}>{children}</span>;
}
function Button({ children, variant = "primary", size = "md", className = "", ...props }) {
  const base = "inline-flex items-center justify-center gap-1.5 font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed";
  const variants = {
    primary: "bg-emerald-700 text-white hover:bg-emerald-800",
    outline: "border border-stone-300 text-stone-700 hover:bg-stone-50 bg-white",
    ghost: "text-stone-500 hover:bg-stone-100 hover:text-stone-800",
    destructive: "bg-red-600 text-white hover:bg-red-700",
  };
  const sizes = { md: "h-9 px-3.5 text-sm", sm: "h-8 px-2.5 text-xs", icon: "h-8 w-8" };
  return <button className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...props}>{children}</button>;
}
function Input(props) { return <input {...props} className={`w-full h-9 px-3 rounded-md border border-stone-300 bg-white text-sm placeholder:text-stone-400 focus:outline-none focus:ring-2 focus:ring-emerald-600/30 focus:border-emerald-600 ${props.className || ""}`} />; }
function Label({ children, className = "" }) { return <label className={`text-xs font-medium text-stone-600 ${className}`}>{children}</label>; }
function ConfirmButton({ onConfirm, title, description, trigger }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="relative inline-block">
      <span onClick={() => setOpen(true)}>{trigger}</span>
      {open && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4" onClick={() => setOpen(false)}>
          <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-5" onClick={(e) => e.stopPropagation()}>
            <h3 className="font-semibold text-stone-900">{title}</h3>
            <p className="text-sm text-stone-500 mt-1.5">{description}</p>
            <div className="flex justify-end gap-2 mt-5">
              <Button variant="outline" size="sm" onClick={() => setOpen(false)}>Cancelar</Button>
              <Button variant="destructive" size="sm" onClick={() => { onConfirm(); setOpen(false); }}>Remover</Button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// XLSX export — matches modelo-inventario.xlsx exactly:
//   Sheet "Formato Longo": Parcela, Arvore, Fuste, Nome Popular, Nome Cientifico,
//                           DAP, Altura, Codigo, Observacao, Latitude, Longitude
//   Sheet "Formato Largo": Parcela, Arvore, Nome Popular, Nome Cientifico,
//                           DAP1, Altura1, DAP2, Altura2, DAP3, Altura3, ...,
//                           Codigo, Observacao, Latitude, Longitude
// ─────────────────────────────────────────────────────────────────────────
function exportXLSX(trees) {
  if (trees.length === 0) return;

  const longRows = [];
  trees.forEach((t) => {
    t.fustes.forEach((f) => {
      longRows.push({
        Parcela: t.parcela, Arvore: t.treeNumber, Fuste: f.fusteNumber,
        "Nome Popular": t.popularName, "Nome Cientifico": t.scientificName || "",
        DAP: f.dap, Altura: f.altura, Codigo: t.codigo || "", Observacao: t.observation || "",
        Latitude: t.latitude ?? "", Longitude: t.longitude ?? "",
      });
    });
  });

  const maxFustes = Math.max(3, ...trees.map((t) => t.fustes.length));
  const wideRows = trees.map((t) => {
    const row = { Parcela: t.parcela, Arvore: t.treeNumber, "Nome Popular": t.popularName, "Nome Cientifico": t.scientificName || "" };
    for (let i = 1; i <= maxFustes; i++) {
      const f = t.fustes[i - 1];
      row[`DAP${i}`] = f ? f.dap : "";
      row[`Altura${i}`] = f ? f.altura : "";
    }
    row.Codigo = t.codigo || ""; row.Observacao = t.observation || "";
    row.Latitude = t.latitude ?? ""; row.Longitude = t.longitude ?? "";
    return row;
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(longRows), "Formato Longo");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(wideRows), "Formato Largo");
  XLSX.writeFile(wb, `inventario_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

// ─────────────────────────────────────────────────────────────────────────
// Collection form (create + edit)
// ─────────────────────────────────────────────────────────────────────────
function emptyForm() {
  return { parcela: "", codigo: "", popularName: "", scientificName: "", observation: "", latitude: "", longitude: "", fustes: [{ fusteNumber: 1, dap: "", altura: "" }] };
}

function ColetorForm({ species, observations, trees, addTree, updateTree, editingTree, cancelEdit }) {
  const [form, setForm] = useState(emptyForm());
  const [showSuggestions, setShowSuggestions] = useState(false);
  const [gpsLoading, setGpsLoading] = useState(false);
  const [errors, setErrors] = useState({});

  useEffect(() => {
    if (editingTree) {
      setForm({
        parcela: editingTree.parcela, codigo: editingTree.codigo || "", popularName: editingTree.popularName,
        scientificName: editingTree.scientificName || "", observation: editingTree.observation || "",
        latitude: editingTree.latitude != null ? String(editingTree.latitude) : "",
        longitude: editingTree.longitude != null ? String(editingTree.longitude) : "",
        fustes: editingTree.fustes.map((f) => ({ fusteNumber: f.fusteNumber, dap: String(f.dap), altura: String(f.altura) })),
      });
      setErrors({});
    } else {
      setForm(emptyForm());
    }
  }, [editingTree]);

  const nextNum = useMemo(() => {
    if (!form.parcela || editingTree) return editingTree ? editingTree.treeNumber : null;
    const existing = trees.filter((t) => t.parcela === form.parcela);
    return existing.length > 0 ? Math.max(...existing.map((t) => t.treeNumber)) + 1 : 1;
  }, [form.parcela, trees, editingTree]);

  const filteredSpecies = species.filter((s) => s.popularName.toLowerCase().includes(form.popularName.toLowerCase())).slice(0, 6);

  const set = (patch) => setForm((f) => ({ ...f, ...patch }));

  const getGPS = () => {
    if (!navigator.geolocation) return;
    setGpsLoading(true);
    navigator.geolocation.getCurrentPosition(
      (pos) => { set({ latitude: pos.coords.latitude.toFixed(7), longitude: pos.coords.longitude.toFixed(7) }); setGpsLoading(false); },
      () => setGpsLoading(false), { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  const submit = (e) => {
    e.preventDefault();
    const errs = {};
    if (!form.parcela.trim()) errs.parcela = "Informe a parcela";
    if (!form.popularName.trim()) errs.popularName = "Informe o nome popular";
    const parsedFustes = form.fustes.map((f, i) => ({ fusteNumber: i + 1, dap: parseFloat(f.dap), altura: parseFloat(f.altura) }));
    if (parsedFustes.some((f) => !(f.dap > 0) || !(f.altura > 0))) errs.fustes = "Preencha DAP e altura de todos os fustes";
    setErrors(errs);
    if (Object.keys(errs).length > 0) return;

    const payload = {
      parcela: form.parcela.trim(), codigo: form.codigo.trim(), popularName: form.popularName.trim(),
      scientificName: form.scientificName.trim(), observation: form.observation.trim(),
      latitude: form.latitude ? parseFloat(form.latitude) : null, longitude: form.longitude ? parseFloat(form.longitude) : null,
      fustes: parsedFustes.map((f, i) => ({ ...f, id: editingTree?.fustes[i]?.id ?? uid() })),
    };

    if (editingTree) {
      updateTree({ ...editingTree, ...payload });
    } else {
      addTree({ id: uid(), treeNumber: nextNum ?? 1, ...payload });
      setForm({ ...emptyForm(), parcela: form.parcela });
    }
  };

  return (
    <form onSubmit={submit} className="space-y-5">
      {editingTree && (
        <div className="flex items-center justify-between bg-amber-50 border border-amber-200 rounded-lg px-4 py-2.5">
          <p className="text-sm text-amber-800">Editando árvore <strong>#{editingTree.treeNumber}</strong> da parcela <strong>{editingTree.parcela}</strong></p>
          <Button type="button" variant="ghost" size="sm" onClick={cancelEdit}><IconX size={14} /> Cancelar edição</Button>
        </div>
      )}

      <Card className="p-5 space-y-4">
        <h3 className="text-xs font-semibold text-stone-500 uppercase tracking-wide">Identificação da Parcela</h3>
        <div className="grid grid-cols-2 gap-4">
          <div className="space-y-1.5">
            <Label>Parcela *</Label>
            <Input placeholder="Ex: P01, A-1..." value={form.parcela} onChange={(e) => set({ parcela: e.target.value })} disabled={!!editingTree} />
            {errors.parcela && <p className="text-xs text-red-600">{errors.parcela}</p>}
          </div>
          <div className="space-y-1.5">
            <Label>Nº da Árvore</Label>
            <div className="h-9 flex items-center px-3 rounded-md border border-stone-200 bg-stone-50 text-sm text-stone-500">
              {nextNum ? <span className="font-medium text-stone-800">#{nextNum}</span> : <span>— automático —</span>}
            </div>
          </div>
        </div>
        <div className="space-y-1.5"><Label>Código de Campo (opcional)</Label><Input placeholder="Ex: A001" value={form.codigo} onChange={(e) => set({ codigo: e.target.value })} /></div>
      </Card>

      <Card className="p-5 space-y-4">
        <h3 className="text-xs font-semibold text-stone-500 uppercase tracking-wide">Identificação da Espécie</h3>
        <div className="space-y-1.5 relative">
          <Label>Nome Popular *</Label>
          <Input placeholder="Ex: Ipê, Jatobá..." value={form.popularName}
            onFocus={() => setShowSuggestions(true)} onBlur={() => setTimeout(() => setShowSuggestions(false), 150)}
            onChange={(e) => set({ popularName: e.target.value })} />
          {errors.popularName && <p className="text-xs text-red-600">{errors.popularName}</p>}
          {showSuggestions && filteredSpecies.length > 0 && (
            <div className="absolute z-10 mt-1 w-full bg-white border border-stone-200 rounded-lg shadow-lg overflow-hidden">
              {filteredSpecies.map((s) => (
                <div key={s.id} className="px-3 py-2 hover:bg-emerald-50 cursor-pointer" onMouseDown={() => set({ popularName: s.popularName, scientificName: s.scientificName })}>
                  <p className="text-sm font-medium">{s.popularName}</p><p className="text-xs text-stone-500 italic">{s.scientificName}</p>
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="space-y-1.5"><Label>Nome Científico (opcional)</Label><Input className="italic" placeholder="Ex: Handroanthus sp." value={form.scientificName} onChange={(e) => set({ scientificName: e.target.value })} /></div>
      </Card>

      <Card className="p-5 space-y-4">
        <h3 className="text-xs font-semibold text-stone-500 uppercase tracking-wide">Coordenadas GPS (opcional)</h3>
        <div className="grid grid-cols-2 gap-4">
          <div className="space-y-1.5"><Label>Latitude</Label><Input placeholder="-16.7" value={form.latitude} onChange={(e) => set({ latitude: e.target.value })} /></div>
          <div className="space-y-1.5"><Label>Longitude</Label><Input placeholder="-43.8" value={form.longitude} onChange={(e) => set({ longitude: e.target.value })} /></div>
        </div>
        <Button type="button" variant="outline" size="sm" onClick={getGPS} disabled={gpsLoading}><IconMapPin size={16} /> {gpsLoading ? "Obtendo GPS..." : "Capturar GPS"}</Button>
      </Card>

      <Card className="p-5 space-y-3">
        <div className="flex items-center justify-between">
          <h3 className="text-xs font-semibold text-stone-500 uppercase tracking-wide">Fustes (DAP e Altura)</h3>
          <Button type="button" variant="outline" size="sm" onClick={() => set({ fustes: [...form.fustes, { fusteNumber: form.fustes.length + 1, dap: "", altura: "" }] })}><IconPlus size={14} /> Adicionar Fuste</Button>
        </div>
        {errors.fustes && <p className="text-xs text-red-600">{errors.fustes}</p>}
        {form.fustes.map((f, index) => (
          <div key={index} className="flex items-start gap-3">
            <Badge tone="outline" className="mt-2 w-8 justify-center shrink-0">{index + 1}</Badge>
            <div className="grid grid-cols-2 gap-3 flex-1">
              <div className="space-y-1"><Label>DAP (cm) *</Label><Input type="number" step="0.1" placeholder="0.0" value={f.dap} onChange={(e) => set({ fustes: form.fustes.map((x, i) => i === index ? { ...x, dap: e.target.value } : x) })} /></div>
              <div className="space-y-1"><Label>Altura (m) *</Label><Input type="number" step="0.1" placeholder="0.0" value={f.altura} onChange={(e) => set({ fustes: form.fustes.map((x, i) => i === index ? { ...x, altura: e.target.value } : x) })} /></div>
            </div>
            {form.fustes.length > 1 && <Button type="button" variant="ghost" size="icon" className="mt-1" onClick={() => set({ fustes: form.fustes.filter((_, i) => i !== index) })}><IconTrash size={14} /></Button>}
          </div>
        ))}
      </Card>

      <Card className="p-5 space-y-3">
        <h3 className="text-xs font-semibold text-stone-500 uppercase tracking-wide">Observações</h3>
        {observations.length > 0 && (
          <div className="flex flex-wrap gap-1.5">
            {observations.map((o) => (
              <Badge key={o.id} tone="outline" onClick={() => { const tag = `[${o.code}]`; if (!form.observation.includes(tag)) set({ observation: form.observation ? `${form.observation} ${tag}` : tag }); }}>{o.code}</Badge>
            ))}
          </div>
        )}
        <textarea rows={3} placeholder="Observações sobre a árvore..." value={form.observation} onChange={(e) => set({ observation: e.target.value })}
          className="w-full rounded-md border border-stone-300 text-sm p-3 focus:outline-none focus:ring-2 focus:ring-emerald-600/30" />
      </Card>

      <div className="flex gap-3">
        <Button type="submit">{editingTree ? <><IconCheck size={16} /> Salvar Alterações</> : <><IconTreePine size={16} /> Registrar Árvore</>}</Button>
        {!editingTree && <Button type="button" variant="outline" onClick={() => setForm(emptyForm())}>Limpar</Button>}
      </div>
    </form>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// Collected list (edit / delete)
// ─────────────────────────────────────────────────────────────────────────
function ColetorList({ trees, removeTree, startEdit, editingId }) {
  const parcelas = [...new Set(trees.map((t) => t.parcela))];
  if (trees.length === 0) {
    return (
      <Card className="py-16 flex flex-col items-center gap-3 text-center">
        <IconTreePine size={44} className="text-stone-300" />
        <p className="text-stone-500 text-sm">Nenhuma árvore registrada ainda. Use o formulário para começar a coleta.</p>
      </Card>
    );
  }
  return (
    <div className="space-y-5">
      {parcelas.map((p) => {
        const list = trees.filter((t) => t.parcela === p);
        return (
          <div key={p} className="space-y-2">
            <div className="flex items-center gap-2"><Badge>{p}</Badge><span className="text-xs text-stone-500">{list.length} árvore(s)</span></div>
            {list.map((tree) => (
              <Card key={tree.id} className={`p-4 hover:shadow-sm transition-shadow ${editingId === tree.id ? "ring-2 ring-emerald-500/40 border-emerald-300" : ""}`}>
                <div className="flex items-start justify-between gap-3">
                  <div className="flex items-start gap-3 min-w-0">
                    <div className="h-9 w-9 rounded-lg bg-emerald-50 flex items-center justify-center shrink-0"><span className="text-xs font-bold text-emerald-700">#{tree.treeNumber}</span></div>
                    <div className="min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <p className="font-medium text-sm text-stone-800">{tree.popularName}</p>
                        {tree.scientificName && <span className="text-xs text-stone-500 italic">{tree.scientificName}</span>}
                        {tree.codigo && <Badge tone="outline">{tree.codigo}</Badge>}
                      </div>
                      {tree.fustes?.length > 0 && (
                        <div className="flex flex-wrap gap-1.5 mt-2">
                          {tree.fustes.map((f) => (
                            <span key={f.id} className="inline-flex items-center gap-1 text-xs bg-stone-100 rounded-md px-2 py-0.5">
                              <span className="text-stone-500">F{f.fusteNumber}</span><span className="font-medium">DAP {f.dap}cm</span>
                              <span className="text-stone-400">·</span><span className="font-medium">Alt {f.altura}m</span>
                            </span>
                          ))}
                        </div>
                      )}
                      {tree.latitude != null && tree.longitude != null && <p className="text-xs text-stone-500 mt-1.5 flex items-center gap-1"><IconMapPin size={12} /> {tree.latitude.toFixed ? tree.latitude.toFixed(5) : tree.latitude}, {tree.longitude.toFixed ? tree.longitude.toFixed(5) : tree.longitude}</p>}
                      {tree.observation && <p className="text-xs text-stone-500 mt-1 line-clamp-1">{tree.observation}</p>}
                    </div>
                  </div>
                  <div className="flex items-center gap-1 shrink-0">
                    <Button variant="ghost" size="icon" onClick={() => startEdit(tree)}><IconEdit size={16} /></Button>
                    <ConfirmButton title="Remover árvore?" description={`A árvore #${tree.treeNumber} (${tree.popularName}) e todos os seus fustes serão removidos permanentemente.`}
                      onConfirm={() => removeTree(tree.id)} trigger={<Button variant="ghost" size="icon"><IconTrash size={16} /></Button>} />
                  </div>
                </div>
              </Card>
            ))}
          </div>
        );
      })}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// App shell — single page, Coletor only
// ─────────────────────────────────────────────────────────────────────────
function App() {
  const initial = loadData();
  const [trees, setTrees] = useState(initial?.trees ?? []);
  const [species] = useState(initial?.species ?? seedSpecies);
  const [observations] = useState(initial?.observations ?? seedObservations);
  const [editingId, setEditingId] = useState(null);
  const [saveState, setSaveState] = useState("saved");
  const [tab, setTab] = useState("form"); // mobile: form | list

  useEffect(() => {
    setSaveState("saving");
    const t = setTimeout(() => { const ok = saveData({ trees, species, observations }); setSaveState(ok ? "saved" : "error"); }, 300);
    return () => clearTimeout(t);
  }, [trees, species, observations]);

  const addTree = (t) => setTrees((prev) => [...prev, t]);
  const updateTree = (updated) => { setTrees((prev) => prev.map((t) => t.id === updated.id ? updated : t)); setEditingId(null); };
  const removeTree = (id) => { setTrees((prev) => prev.filter((t) => t.id !== id)); if (editingId === id) setEditingId(null); };
  const editingTree = trees.find((t) => t.id === editingId) || null;

  const resetAll = () => {
    if (!confirm("Isso vai apagar todos os dados coletados salvos neste navegador. Continuar?")) return;
    localStorage.removeItem(STORAGE_KEY);
    setTrees([]); setEditingId(null);
  };

  return (
    <div className="min-h-screen bg-stone-50 text-stone-900">
      <header className="sticky top-0 z-20 bg-white border-b border-stone-200">
        <div className="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
          <div className="flex items-center gap-2.5">
            <div className="h-8 w-8 rounded-lg bg-emerald-700 flex items-center justify-center shrink-0"><IconSprout size={18} className="text-white" /></div>
            <div>
              <p className="font-semibold text-stone-900 tracking-tight leading-tight">ArborSense</p>
              <p className="text-xs text-stone-500 leading-tight">Coletor de Campo</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <span className="hidden sm:inline text-xs text-stone-400">{saveState === "saving" ? "Salvando…" : saveState === "error" ? "Erro ao salvar" : "Salvo neste navegador"}</span>
            <Button variant="outline" onClick={exportXLSX.bind(null, trees)} disabled={trees.length === 0}><IconDownload size={16} /> Exportar XLSX</Button>
          </div>
        </div>
        <div className="max-w-5xl mx-auto px-4 sm:px-6 flex gap-1 border-t border-stone-100 lg:hidden">
          {[{ k: "form", l: "Coletar" }, { k: "list", l: `Coletados (${trees.length})` }].map((t) => (
            <button key={t.k} onClick={() => setTab(t.k)} className={`px-4 py-2.5 text-sm font-medium border-b-2 -mb-px transition-colors ${tab === t.k ? "border-emerald-700 text-emerald-800" : "border-transparent text-stone-500"}`}>{t.l}</button>
          ))}
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-4 sm:px-6 py-6 lg:py-8">
        <div className="mb-6 flex items-end justify-between flex-wrap gap-2">
          <div>
            <h1 className="text-2xl font-semibold text-stone-900 flex items-center gap-2"><IconLeaf size={22} className="text-emerald-700" /> Coletar</h1>
            <p className="text-sm text-stone-500 mt-1">Registre árvores em campo e exporte a planilha no formato do inventário</p>
          </div>
          {trees.length > 0 && <button onClick={resetAll} className="text-xs text-stone-400 hover:text-red-600 underline">Limpar todos os dados</button>}
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-5 gap-6 lg:gap-8">
          <div className={`lg:col-span-3 ${tab === "form" ? "" : "hidden lg:block"}`}>
            <ColetorForm species={species} observations={observations} trees={trees} addTree={addTree} updateTree={updateTree} editingTree={editingTree} cancelEdit={() => setEditingId(null)} />
          </div>
          <div className={`lg:col-span-2 ${tab === "list" ? "" : "hidden lg:block"}`}>
            <div className="hidden lg:flex items-center justify-between mb-3">
              <h3 className="text-xs font-semibold text-stone-500 uppercase tracking-wide">Coletados ({trees.length})</h3>
            </div>
            <ColetorList trees={trees} removeTree={removeTree} startEdit={(t) => setEditingId(t.id)} editingId={editingId} />
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
